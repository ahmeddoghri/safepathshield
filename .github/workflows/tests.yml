name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: safepathshield demo
      - run: python -m safepathshield.eval_v2
      - name: The shipped filter must not collide anywhere in the sweep
        run: |
          python -m safepathshield.eval_v2 > /tmp/s.json
          python -c "import json; d=json.load(open('/tmp/s.json')); assert d['tuning']['v2_collision_scenarios']==0 and d['holdout']['v2_collision_scenarios']==0, d"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t safepathshield:ci .
      - name: Smoke-test the workbench
        run: |
          docker run -d --name sp -p 8090:8090 safepathshield:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8090/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8090/ | grep -qi '<html'
